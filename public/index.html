 <div class="hl"><h1>4 man comics</h1>

  <div class="dd" aria-hidden="true"><div class="sq mk">1</div><div class="sq mk">2</div><div class="sq mk">3</div><div class="sq mk">?</div></div></div>
 <div class="card wob">

  <div class="row" style="margin-top:14px;flex-wrap:nowrap;gap:10px"><b style="font-weight:800">Loops</b><span class="row seg" id="loops" style="gap:6px;flex-wrap:nowrap"></span><span id="sum" style="flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.2;color:var(--mute)"></span></div>

 </div>
