<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>4 man comics</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/studio.css?v=5"></head><body>
<div id="err" class="hero hide"><div><h1>Link not valid</h1><p>This link was already used, was replaced, or the comic has ended.</p><p><a href="/">Back home</a></p></div></div>
<section id="draw" class="hide">
 <div class="top"><button class="mk" id="home" title="Back to home">4 man comics</button><span id="info" class="row"></span><span class="sp"></span><span id="loginSlot"></span></div>
 <div class="sub"><div class="pbar" id="pbar"><span class="plabel">Previous panel</span><button class="ib" id="hideBtn" title="Hide previous panel" aria-label="Hide previous panel" data-i="eye"></button></div><div class="lastbar hide" id="last">Last panel! Give the story an ending.</div></div>
 <div class="tabs"><button id="tPrev">Previous panel</button><button id="tDraw" class="on">Your panel</button></div>
 <div class="main"><div class="stage" id="stage">
  <div class="pcol" id="pcol">
   <div class="box"><img id="pimg" alt="Previous panel"></div><div class="pip" id="pip"><button class="ib" id="pipBtn" data-i="pipette" title="Pick a color from this panel" aria-label="Pick a color from this panel"></button><span class="bub" id="bub"></span></div></div>
  <div class="work">
   <div class="tb" id="ltb">
    <button class="ib on" data-t="brush" data-i="brush" title="Brush" aria-label="Brush"></button>
    <button class="ib" data-t="eraser" data-i="eraser" title="Eraser" aria-label="Eraser"></button>
    <button class="ib" data-t="fill" data-i="fill" title="Fill" aria-label="Fill"></button>
    <button class="ib" data-t="line" data-i="line" title="Line" aria-label="Line"></button>
    <button class="ib" data-t="rect" data-i="rect" title="Box" aria-label="Box"></button>
    <button class="ib" data-t="ell" data-i="ell" title="Oval" aria-label="Oval"></button>
    <button class="ib" data-t="eye" data-i="pipette" title="Pick color" aria-label="Pick color"></button>
    <div class="sizebox" title="Brush size"><div class="dot"><i id="dotI"></i></div><input id="size" type="range" min="2" max="60" value="8" aria-label="Brush size"></div>
   </div>
   <div class="cwrap"><div class="box" id="dbox"><img id="ov" alt=""><canvas id="cv" width="800" height="800"></canvas></div><div class="bottom"><div class="pal"><span class="row" id="pal"></span><button class="sw rainbow" id="col" aria-label="More colors" title="More colors"></button></div><button class="pri" id="done" style="font-size:21px;padding:9px 34px">Finish</button></div></div>
   <div class="tb" id="rtb">
    <button class="ib" id="undo" data-i="undo" title="Undo" aria-label="Undo"></button>
    <button class="ib" id="redo" data-i="redo" title="Redo" aria-label="Redo"></button>
    <button class="ib" id="clr" data-i="trash" title="Clear drawing" aria-label="Clear drawing"></button>
    <button class="ib" id="trace" data-i="layers" title="Trace previous panel" aria-label="Trace previous panel"></button>
   </div>
  </div>
 </div>
 </div>
</section>
<div class="mod hide" id="modal"><div class="mbox wob"><button class="ib x" id="mx" aria-label="Back to drawing" data-i="x"></button><div id="mc"></div></div></div>
<script src="/studio.js?v=5"></script></body></html>
